<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Nav bar icon for the TSANet Connect deploy screen.

    Three linked nodes: multi-vendor collaboration, which is what TSANet Connect is.

    Two constraints from Zendesk's spec, both easy to break:
      - No fill attribute anywhere. Zendesk recolours the SVG with its own icon
        colours and drives the hover/active states; a hardcoded fill defeats that.
      - Fills only, never stroke. The recolouring targets fill, so a stroked shape
        keeps its original colour and reads wrong on a dark or branded nav bar.
        The connectors below are therefore rotated rects, not lines.

    Renders at 18x18 inside a 30x30 container, so shapes are kept heavy enough to
    survive the downscale.
  -->
  <rect x="0.67" y="10.1" width="15.65" height="1.8" rx="0.9" transform="rotate(116.57 8.5 11)"/>
  <rect x="7.67" y="10.1" width="15.65" height="1.8" rx="0.9" transform="rotate(63.43 15.5 11)"/>
  <rect x="5" y="17.1" width="14" height="1.8" rx="0.9"/>
  <circle cx="12" cy="4" r="3.1"/>
  <circle cx="5" cy="18" r="3.1"/>
  <circle cx="19" cy="18" r="3.1"/>
</svg>
