<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>TSANet Connect — Background</title>
  <!-- ZAF SDK — required even for background pages -->
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0.37/zaf_sdk.min.js"
          integrity="sha384-9EPbYTFD7Oxlnn4s2sg+mfMtqdTzc1mWRudXMR1EBd9dsUlyuDab2OvDWf0Jolsy"
          crossorigin="anonymous"></script>
</head>
<body>
<script>
/**
 * TSANet Connect — Background Poller
 *
 * Runs silently whenever Zendesk is open in the browser.
 * No UI. No agent interaction required.
 *
 * Every poll cycle (POLL_INTERVAL_MS):
 *   1. Fetch all OPEN/INFORMATION inbound collaboration requests from TSANet
 *   2. For each one, search Zendesk for an existing ticket with that token
 *   3. Create a Zendesk ticket for any that are missing
 *
 * Reuses the same credentials configured in the app settings.
 */

(function() {
  'use strict';

  var POLL_INTERVAL_MS = 60 * 1000; // 1 minute (JWT is cached ~50 min, so this does not increase login calls)
  var client   = null;
  var settings = {};
  var _jwt     = null;
  var _jwtExp  = 0;

  // ZIS-push coexistence (tsanetgit/Zendesk_App#30): when an authenticated
  // webhook (callbackAuth) is registered on the TSANet side, ZIS push is the
  // primary ticket creator; the poller then only backfills a missing ticket
  // after a grace window, so it stops racing push and creating duplicates.
  var PUSH_FALLBACK_GRACE_MS = 3 * 60 * 1000;
  var _pushRegistered    = null; // true/false once known; null = not yet checked
  var _firstSeenNoTicket = {};   // token -> ms first seen open-inbound without a ticket

  // ── Init ──────────────────────────────────────────────────────────────────
  if (typeof ZAFClient === 'undefined') {
    console.error('[TSANet BG] ZAFClient not available');
    return;
  }

  client = ZAFClient.init();

  client.on('app.registered', function() {
    client.metadata().then(function(meta) {
      settings = meta.settings || {};

      // tsanet_password is a secure setting (not exposed to front-end JS); a
      // missing/invalid password surfaces on the login call instead.
      if (!settings.tsanet_username) {
        console.warn('[TSANet BG] Credentials not configured — background polling disabled');
        return;
      }

      console.log('[TSANet BG] Started — polling every 1 minute');

      // One-time check: is ZIS push (an authenticated webhook) registered? If so,
      // the poller becomes a fallback that defers ticket creation to push (#30).
      //
      // BOTH collections are asked, because v1 and v2 webhook subscriptions are
      // separate: probed on BETA 2026-07-28, GET /v1/webhooks listed the live
      // subscription (id 55, BASIC, V1) while GET /v2/webhooks returned []. A
      // member is on one or the other depending on whether they have been
      // migrated (tsanetgit/Zendesk_App#101), and asking only v2 today would
      // report push-not-registered for every existing install.
      //
      // The 2027-01-01 sunset is NOT handled here. Once GET /v1/webhooks is
      // removed its call rejects on every run, so `complete` is never true and
      // the predicate below collapses to a constant: EVERY install reads as
      // push-registered, migrated or not. The poller stays a fallback for
      // everyone, including members with no working push at all, whose inbound
      // tickets then take the PUSH_FALLBACK_GRACE_MS path indefinitely.
      // Nothing is lost, because the fallback still backfills, but nothing
      // recovers either: there is no exit from that state without a code
      // change.
      //
      // Deleting the v1 call is what ends it, and that belongs with the member
      // migration in tsanetgit/Zendesk_App#101. Do not read the fail-closed
      // behaviour below as covering the sunset; it is what produces this.
      Promise.all([
        // Deliberate for the #101 transition, and it does NOT survive the
        // sunset. An earlier comment here said the v2 call "answers in its
        // place" once v1 is gone; that is false, and the block below says so
        // fifteen lines up. Once v1 is removed `complete` is permanently false,
        // so `found || !complete` is constant true and the v2 answer is
        // discarded rather than used. Deleting this call is what ends it, and
        // that is tsanetgit/Zendesk_App#153.
        tsanetGet('/webhooks').catch(function() { return null; }), // audit-degrades: v1-webhooks until 2027-01-01 tracked-by tsanetgit/Zendesk_App#153
        tsanetGet('/webhooks', 'v2').catch(function() { return null; })
      ]).then(function(lists) {
        var reachable = lists.filter(function(l) { return Array.isArray(l); });
        var complete  = reachable.length === lists.length;
        var subs = reachable.reduce(function(all, l) { return all.concat(l); }, []);
        var found = subs.some(function(s) {
          return s && s.callbackAuthType && s.callbackAuthType !== 'NONE';
        });

        // "Not registered" is only safe to conclude when EVERY collection
        // answered. A member's subscription lives in exactly one of them, so a
        // version that did not answer is a place the subscription may be
        // sitting. Concluding not-registered from a partial view promotes the
        // poller to primary, which is the duplicate-inbound-ticket condition
        // this whole change exists to remove: today an unmigrated member has
        // their subscription in v1 while v2 answers [], so a single transient
        // failure on the v1 call would have been enough to trigger it.
        //
        // So anything short of a complete answer fails CLOSED: assume push IS
        // registered and leave the poller a fallback. The two errors are not
        // symmetric. A missed inbound is recoverable, and not only by hand —
        // the poller still backfills it once PUSH_FALLBACK_GRACE_MS passes. A
        // duplicate ticket is member-visible and reaches the partner.
        _pushRegistered = found || !complete;

        console.log('[TSANet BG] ZIS push registered: ' + _pushRegistered +
                    ' (' + reachable.length + ' of ' + lists.length +
                    ' API versions answered, ' + subs.length + ' subscription(s)' +
                    (!found && !complete ? ', incomplete so assuming registered' : '') +
                    '; poller is ' + (_pushRegistered ? 'fallback' : 'primary') + ')');
      });

      // Run immediately on startup, then on POLL_INTERVAL_MS
      pollForInboundCases();
      pollForSlaBreaches();
      setInterval(pollForInboundCases, POLL_INTERVAL_MS);
      setInterval(pollForSlaBreaches, POLL_INTERVAL_MS);

    }).catch(function(err) {
      console.error('[TSANet BG] Failed to load settings:', err);
    });
  });

  // ── TSANet Auth ───────────────────────────────────────────────────────────
  // Version is a parameter, not part of the host string — see main.js for why
  // (tsanetgit/Zendesk_App#144).
  // audit-anchor: default-api-version v1
  var DEFAULT_API_VERSION = 'v1';

  function baseUrl(version) {
    var host = (settings.tsanet_env === 'PRODUCTION')
      ? 'https://connect2.tsanet.org'
      : 'https://connect2.tsanet.net';
    return host + '/' + (version || DEFAULT_API_VERSION);
  }

  function getJwt() {
    if (_jwt && Date.now() < _jwtExp) return Promise.resolve(_jwt);
    // Log in through the ZAF proxy with secure:true so the proxy substitutes
    // {{setting.tsanet_password}} server-side — the password is never in
    // front-end JS. Proxy mode (no cors:true) to a domainWhitelist host.
    return client.request({
      url: baseUrl() + '/login',
      type: 'POST',
      contentType: 'application/json',
      dataType: 'json',
      secure: true,
      data: JSON.stringify({
        username: settings.tsanet_username,
        password: '{{setting.tsanet_password}}'
      })
    }).then(function(data) {
      if (!data || !data.accessToken) throw new Error('No accessToken in response');
      _jwt    = data.accessToken;
      _jwtExp = Date.now() + 50 * 60 * 1000; // cache for 50 min
      return _jwt;
    }, function(err) {
      var status = (err && err.status) || '?';
      var detail = (err && (err.responseText || (err.responseJSON && JSON.stringify(err.responseJSON)))) || '';
      throw new Error('TSANet login failed (HTTP ' + status + '). ' + String(detail).substring(0, 80));
    });
  }

  // `retried` guards the 401 path. Without it a login that SUCCEEDS followed by
  // a call that still 401s recurses forever, re-submitting credentials each
  // pass, and because it never rejects the caller's .catch never runs while
  // setInterval starts another non-terminating chain every 60 seconds
  // (tsanetgit/Zendesk_App#155). getJwt() rejects on a failed login, so only
  // the login-succeeds-then-401 case was ever unbounded.
  function tsanetGet(path, version, retried) {
    return getJwt().then(function(jwt) {
      return fetch(baseUrl(version) + path, {
        headers: { Authorization: 'Bearer ' + jwt }
      });
    }).then(function(res) {
      if (res.status === 401 && !retried) { _jwt = null; return tsanetGet(path, version, true); }
      if (!res.ok) throw new Error('TSANet GET failed: ' + res.status);
      return res.json();
    });
  }

  // ── Zendesk ticket tags ───────────────────────────────────────────────────
  // Add one tag without disturbing the ticket's other tags. Resolves true if it
  // wrote, false if the tag was already there.
  //
  // Zendesk names POST /api/v2/tickets/{id}/tags.json "Add Tags", and it does NOT
  // add: it REPLACES the tag set. Probed 2026-07-29 on a scratch ticket carrying
  // two tags, with no trigger or automation on the instance touching tags: a POST
  // of one tag left exactly that one tag, the response body echoed only the posted
  // tag, and the ticket audit recorded ['probe_keep_a','probe_keep_b'] ->
  // ['probe_added_c']. Both tag writes in this app used it and silently destroyed
  // whatever else was on the ticket, including the tagger-backed TSANet Status
  // field, which Zendesk stores as a tag (tsanetgit/Zendesk_App#165).
  //
  // `additional_tags` is not the way out either: on the single-ticket update
  // endpoint it returns 200 and writes nothing, with no audit event.
  //
  // So read, write the union, and guard the write with safe_update so a ticket
  // that changed underneath us is rejected (409 UpdateConflict) instead of being
  // clobbered by a stale tag list. One retry absorbs the ordinary race; a second
  // conflict is left for the next poll rather than looped on, so this cannot
  // become the kind of unbounded retry chain tsanetgit/Zendesk_App#155 removed.
  //
  // main.js carries the same function with the same signature. Keep them identical;
  // the two files have already drifted once on a shared helper's argument order.
  function addTicketTag(ticketId, tag, retried) {
    return client.request({ url: '/api/v2/tickets/' + ticketId + '.json', type: 'GET' })
      .then(function(d) {
        var tags = (d && d.ticket && d.ticket.tags) || [];
        if (tags.indexOf(tag) !== -1) return false;
        return client.request({
          url: '/api/v2/tickets/' + ticketId + '.json',
          type: 'PUT',
          contentType: 'application/json',
          data: JSON.stringify({
            ticket: {
              tags: tags.concat([tag]),
              safe_update: true,
              updated_stamp: d.ticket.updated_at
            }
          })
        }).then(function() { return true; }, function(err) {
          if (((err && err.status) || 0) === 409 && !retried) {
            return addTicketTag(ticketId, tag, true);
          }
          throw err;
        });
      });
  }

  // ── SLA Breach Detection ──────────────────────────────────────────────────
  // Every poll cycle: find any OPEN/INFORMATION cases past their respondBy
  // deadline and add tag tsanet_sla_breached to the corresponding Zendesk ticket.
  // The tag is only added once (idempotent check prevents repeat notifications).
  // A Zendesk trigger fires on tag addition → emails the assignee.
  function pollForSlaBreaches() {
    console.log('[TSANet BG] Checking for SLA breaches...');

    // Only check OPEN cases — SLA is acknowledgment-only per TSANet policy.
    // Once a case is acknowledged (Accept/Reject/Req Info), TSANet stops tracking it.
    Promise.all([
      tsanetGet('/collaboration-requests/list?status=OPEN', 'v2').catch(function() { return []; })
    ]).then(function(results) {
      var allActive = results[0] || [];
      var now = Date.now();

      var breached = allActive.filter(function(c) {
        return c.respondBy && c.responded === false && new Date(c.respondBy).getTime() < now;
      });

      if (!breached.length) {
        console.log('[TSANet BG] No SLA breaches found');
        return;
      }

      console.log('[TSANet BG] Found ' + breached.length + ' SLA breach(es) — tagging tickets');

      return Promise.all(breached.map(function(c) {
        // Find the Zendesk ticket for this token
        return client.request({
          url: '/api/v2/search.json?query=custom_field_' +
               settings.field_id_token + ':' + c.token + '&type=ticket',
          type: 'GET'
        }).then(function(res) {
          if (!res.count || !res.results.length) return;
          var ticket = res.results[0];

          // Skip if already tagged — prevents duplicate trigger fires. The search
          // result can lag the index, so this only saves addTicketTag's read in the
          // common case; the authoritative check is inside it.
          if ((ticket.tags || []).indexOf('tsanet_sla_breached') !== -1) return;

          return addTicketTag(ticket.id, 'tsanet_sla_breached').then(function(written) {
            if (written) {
              console.log('[TSANet BG] ⚠️ SLA breached — tagged ticket #' + ticket.id +
                          ' (token ' + c.token.substring(0, 8) + '...)');
            }
          });
        }).catch(function(err) {
          console.warn('[TSANet BG] SLA tag error for token ' +
                       c.token.substring(0, 8) + '...:', err.message || String(err));
        });
      }));

    }).catch(function(err) {
      console.error('[TSANet BG] SLA breach check failed:', err.message || String(err));
    });
  }

  // ── Core Poll Logic ───────────────────────────────────────────────────────
  function pollForInboundCases() {
    console.log('[TSANet BG] Polling for inbound cases...');

    tsanetGet('/collaboration-requests/list?type=INBOUND', 'v2').then(function(cases) {
      var open = (cases || []).filter(function(c) {
        return c.status === 'OPEN' || c.status === 'INFORMATION';
      });

      if (!open.length) {
        console.log('[TSANet BG] No open inbound cases');
        return;
      }

      console.log('[TSANet BG] Found ' + open.length + ' open inbound case(s) — checking for missing tickets');

      // Check each token against Zendesk search
      return Promise.all(open.map(function(collab) {
        return client.request({
          url: '/api/v2/search.json?query=custom_field_' +
               settings.field_id_token + ':' + collab.token + '&type=ticket',
          type: 'GET'
        }).then(function(res) {
          return { collab: collab, exists: res.count > 0 };
        }).catch(function() {
          return { collab: collab, exists: true }; // assume exists on error — be conservative
        });
      })).then(function(checked) {
        checked.forEach(function(r) { if (r.exists) delete _firstSeenNoTicket[r.collab.token]; });
        var now = Date.now();
        var toCreate = checked.filter(function(r) {
          if (r.exists) return false;
          var tok = r.collab.token;
          if (_pushRegistered === false) { delete _firstSeenNoTicket[tok]; return true; } // no push: poller is primary
          if (!_firstSeenNoTicket[tok]) _firstSeenNoTicket[tok] = now;                     // push (or unknown): defer, backfill only after grace
          return (now - _firstSeenNoTicket[tok]) >= PUSH_FALLBACK_GRACE_MS;
        });

        if (!toCreate.length) {
          console.log('[TSANet BG] All inbound cases already have Zendesk tickets');
          return;
        }

        console.log('[TSANet BG] Creating ' + toCreate.length + ' missing ticket(s)');

        return Promise.all(toCreate.map(function(r) {
          var c = r.collab;
          var zdPriority = c.priority === 'HIGH' ? 'urgent'
                         : c.priority === 'MEDIUM' ? 'normal' : 'low';

          return client.request({
            url: '/api/v2/tickets.json',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
              ticket: {
                subject: 'TSANet Inbound from ' + c.submitCompanyName + ': ' + c.summary,
                description: 'Inbound TSANet Collaboration Request.\n\nFrom: ' +
                  c.submitCompanyName + '\nPriority: ' + c.priority +
                  '\nToken: ' + c.token + '\n\n' + (c.description || ''),
                priority: zdPriority,
                tags: ['tsanet_inbound', 'tsanet_status_open'],
                comment: {
                  body: '\u2b05\ufe0f New inbound TSANet Collaboration Request from ' +
                    c.submitCompanyName + '.\n\nPriority: ' + c.priority +
                    '\nToken: ' + c.token +
                    '\n\nTo respond, set the TSANet Action field (Accept / Request Info / Reject) and submit the ticket, or use the TSANet Connect app in the sidebar.',
                  public: false
                },
                custom_fields: [
                  { id: parseInt(settings.field_id_token),   value: c.token },
                  { id: parseInt(settings.field_id_status),  value: 'tsanet_status_open' },
                  { id: parseInt(settings.field_id_partner), value: c.submitCompanyName }
                ]
              }
            })
          }).then(function(resp) {
            console.log('[TSANet BG] \u2705 Created ticket #' + resp.ticket.id +
                        ' for inbound case ' + c.token.substring(0, 8) + '...');
          });
        }));
      });

    }).catch(function(err) {
      console.error('[TSANet BG] Poll error:', err.message || String(err));
      // Token may have expired — clear so next poll re-authenticates
      if (String(err).includes('401') || String(err).includes('login')) {
        _jwt = null;
      }
    });
  }

})();
</script>
</body>
</html>
