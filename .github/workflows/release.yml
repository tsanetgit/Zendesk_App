name: Package ZAF app

# Build the installable ZAF zip and attach it to a GitHub Release whenever a
# version tag is pushed. The zip is a pure package of the committed zaf-build/
# files — no transpile step — so a release can never diverge from the repo.
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# Supply-chain hardening (security #93 — EDB "CI release pipeline tampering"):
#   - Least-privilege GITHUB_TOKEN: nothing is granted at workflow scope; the
#     publish job requests only the write scopes it actually needs.
#   - Third-party actions are pinned to a full commit SHA (human-readable tag
#     in the trailing comment) so a moved tag can't swap the action out.
#   - Publishing is gated on the protected `release` environment (required
#     reviewer), so an unreviewed or tampered tag cannot publish an artifact
#     to every member install without a human approving it.
#   - The artifact ships with a SLSA build-provenance attestation and a
#     SHA-256 checksum, both verifiable at install time.

on:
  push:
    tags:
      - 'v*'

# Least privilege by default: grant no token scopes at the workflow level.
# The job below opts into exactly the scopes it needs.
permissions: {}

jobs:
  # Pre-tag security status. Runs UNGATED and first, so its summary is on the
  # run page before the approver decides. It never blocks: a flagged release
  # is still releasable, but the human accepting that risk does so knowingly
  # and the acceptance is on the record. See the connector security review
  # taxonomy for what a full audit covers.
  security-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      flagged: ${{ steps.status.outputs.flagged }}
      covered: ${{ steps.status.outputs.covered }}
      note: ${{ steps.status.outputs.note }}
      reason: ${{ steps.status.outputs.reason }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Evaluate security audit coverage
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Two independent questions, deliberately not collapsed into one
          # boolean (tsanetgit/Zendesk_App#115):
          #   COVERED  — is this exact build covered by a current review?
          #   FINDINGS — does it ship with known open findings?
          # "Never reviewed" and "reviewed, one known item accepted" are very
          # different things to tell a member, and a single flag cannot say
          # which one happened.
          FLAGGED=false
          COVERED=true
          # A findings check that could not run is neither clean nor a finding.
          # Without this, an API failure rendered as "ships with unaccepted
          # findings", which is the #115 defect (heading not matching the reason)
          # reappearing in the branch added to fix #128.
          INDETERMINATE=false
          REASONS=""
          FINDINGS_REASON=""
          flag() { FLAGGED=true; REASONS="${REASONS}- $1"$'\n'; }
          flag_coverage() { COVERED=false; flag "$1"; }

          # 1. Mechanical checks must not FAIL. Capture the exit code explicitly:
          # reading $? after the `if` works today but breaks the moment any
          # command is inserted between them.
          AUDIT_RC=0
          python3 scripts/security-audit.py --no-network > /tmp/audit.txt 2>&1 || AUDIT_RC=$?
          case "$AUDIT_RC" in
            0) echo "mechanical checks: clean" ;;
            2) echo "mechanical checks: warnings only" ;;
            *) flag_coverage "Mechanical security checks reported failures (exit $AUDIT_RC)." ;;
          esac

          # 2. An audit record must exist, parse, and cover this commit.
          #
          # Validated in ONE python call that either prints both fields or exits
          # nonzero. A partial read is the dangerous case: a missing key that
          # becomes an empty string, compared numerically, errors and reads as
          # "no findings" — assurance manufactured from a parse failure, which is
          # the #108 failure mode in a new place.
          ACCEPTED=""
          if [ ! -f .security-audit.json ]; then
            flag_coverage "No .security-audit.json — this build has never been security reviewed."
          else
            AUDIT_FIELDS=""
            if ! AUDIT_FIELDS=$(python3 - <<'PY' 2>/tmp/audit-parse.txt
import json, re, sys
try:
    d = json.load(open('.security-audit.json'))
except Exception as e:
    sys.exit('unreadable: %s' % e)
rc = str(d.get('reviewed_commit', ''))
if not re.fullmatch(r'[0-9a-f]{7,40}', rc):
    sys.exit('reviewed_commit is not a hex sha: %r' % rc)
acc = d.get('accepted_issues', [])
if not isinstance(acc, list) or not all(isinstance(x, int) for x in acc):
    sys.exit('accepted_issues must be a list of integers')
print(rc)
print(' '.join(str(x) for x in acc))
PY
            ); then
              flag_coverage "Audit record is unreadable or invalid ($(head -c 200 /tmp/audit-parse.txt | tr '\n' ' ')). Security status is INDETERMINATE, not clean."
            else
              REVIEWED=$(printf '%s\n' "$AUDIT_FIELDS" | sed -n 1p)
              ACCEPTED=$(printf '%s\n' "$AUDIT_FIELDS" | sed -n 2p)
              if ! git merge-base --is-ancestor "$REVIEWED" HEAD 2>/dev/null; then
                flag_coverage "Audit record references commit $REVIEWED, which is not an ancestor of this tag."
              else
                # Source changes since the audit invalidate it. Docs do not.
                # The shipped artifact is a pure package of zaf-build/, so this
                # allowlist covers everything that can reach a member.
                CHANGED=$(git diff --name-only "$REVIEWED"..HEAD -- zaf-build/ zis/ scripts/ .github/workflows/ | tr '\n' ' ')
                if [ -n "$CHANGED" ]; then
                  flag_coverage "Source changed since the last audit ($REVIEWED): $CHANGED"
                fi
              fi
            fi
          fi

          # 3. Open security findings.
          #
          # Two failure modes this deliberately avoids (tsanetgit/Zendesk_App#108):
          #   - Swallowing a query error and reading it as zero. A control that
          #     reports "clean" when it could not check is worse than one that
          #     reports nothing: it manufactures assurance exactly when it is
          #     least able to justify it.
          #   - Querying `--label security --label high-priority`, an AND, which
          #     makes any security issue lacking a priority label invisible.
          # Query once on the `security` label alone, then classify by priority.
          # Low-priority issues are reported but do not flag. Unprioritised ones
          # DO flag, because their severity is unknown rather than known-small.
          if ! SEC_LINES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label security --limit 200 --json number,labels --jq '.[] | "#\(.number) \([.labels[].name] | map(select(endswith("-priority"))) | first // "unprioritised")"' 2>/tmp/gh-err.txt); then
            INDETERMINATE=true
            FINDINGS_REASON="an indeterminate findings check — the open-issue query failed, so this is UNKNOWN rather than clean"
            flag "Could NOT query open security issues ($(head -c 200 /tmp/gh-err.txt | tr '\n' ' ')). Security status is INDETERMINATE, not clean."
          elif [ -z "$SEC_LINES" ]; then
            echo "open security issues: none"
          else
            # BLOCKING counts high/medium/unprioritised; SUMMARY lists every
            # open security issue. Report both numbers explicitly rather than
            # pairing one count with the other's list: a note that says "1
            # finding" and then names two contradicts itself, and a member
            # reading a self-inconsistent security statement has no reason to
            # trust the rest of it.
            # An issue blocks when it is high/medium/unprioritised AND is not
            # named in the audit record's accepted_issues.
            #
            # Why accepted_issues exists (#128): blocking on the whole backlog
            # meant the gate flagged EVERY release, because long-horizon items
            # (#96 durable audit trail, #119 move off password auth) never
            # close. v1.0.49 — genuinely uncovered, shipped a HIGH regression —
            # and v1.0.50 — reviewed pre-tag, three defects fixed — produced the
            # same banner. A control whose output does not change when the thing
            # it measures changes is not measuring it.
            #
            # Acceptance is deliberately NOT a label: labels are mutable by
            # anyone with triage, unrecorded and unreviewed. It lives in the
            # audit record, so it goes through review like code, and because
            # source drift invalidates coverage it expires with the audit rather
            # than persisting silently. A newly-filed finding is still caught:
            # it is not on the accepted list, so it blocks.
            BLOCKING_LINES=""
            ACCEPTED_LINES=""
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              num=$(printf '%s' "$line" | sed 's/^#\([0-9]*\).*/\1/')
              case "$line" in
                *' low-priority') continue ;;
              esac
              if printf ' %s ' "$ACCEPTED" | grep -q " $num "; then
                ACCEPTED_LINES="${ACCEPTED_LINES}${line}"$'\n'
              else
                BLOCKING_LINES="${BLOCKING_LINES}${line}"$'\n'
              fi
            done <<< "$SEC_LINES"

            BLOCKING=$(printf '%s' "$BLOCKING_LINES" | grep -c . || true)
            TOTAL=$(printf '%s\n' "$SEC_LINES" | grep -c . || true)
            # Each count is printed with ITS OWN list. #118 fixed this pairing on
            # FINDINGS_REASON and the flag() beside it kept the old form, which
            # is how "5 open" came to be printed above six names.
            BLOCKING_LIST=$(printf '%s' "$BLOCKING_LINES" | paste -sd';' - | sed 's/;/; /g')
            CONTEXT_LIST=$(printf '%s\n' "$SEC_LINES" | paste -sd';' - | sed 's/;/; /g')
            if [ "${BLOCKING:-0}" -gt 0 ]; then
              FINDINGS_REASON="$BLOCKING open security finding(s) not accepted by the audit record: $BLOCKING_LIST"
              flag "$BLOCKING blocking security issue(s) — $BLOCKING_LIST"
            else
              echo "no blocking security issues; $TOTAL open in total: $CONTEXT_LIST"
            fi
          fi

          {
            # Three outcomes, not two (#128). "Never reviewed" and "reviewed,
            # ships with a finding nobody accepted" need different sentences;
            # printing the coverage wording for both made every release read as
            # unreviewed, including ones that had been reviewed that hour.
            if [ "$COVERED" != true ]; then
              echo "## Release NOT covered by a current security audit"
              echo ""
              echo "The audit record does not cover this commit, or the checks could not"
              echo "be completed. It can still be approved, but approving it accepts the"
              echo "risk below, and that acceptance is recorded on this run."
              echo ""
              echo "$REASONS"
              echo "Resolve by running the Security Review persona against this commit and"
              echo "committing an updated \`.security-audit.json\`."
            elif [ "$INDETERMINATE" = true ]; then
              echo "## Release reviewed, but the findings check could not run"
              echo ""
              echo "The audit record covers this exact commit with no source drift, so the"
              echo "review is current. The open-issue query failed, so whether this release"
              echo "ships with unaccepted findings is **UNKNOWN**, not clean. Approving"
              echo "accepts that uncertainty, and that acceptance is recorded here."
              echo ""
              echo "$REASONS"
              echo "Resolve by re-running this job once the query succeeds."
            elif [ "$FLAGGED" = true ]; then
              echo "## Release reviewed, but ships with unaccepted findings"
              echo ""
              echo "The audit record covers this exact commit with no source drift, so the"
              echo "review is current. These findings are open and are **not** named in the"
              echo "record's \`accepted_issues\`, so nobody has signed off on shipping with"
              echo "them. Approving accepts them, and that acceptance is recorded here."
              echo ""
              echo "$REASONS"
              echo "Resolve by addressing them, or by accepting them explicitly in"
              echo "\`.security-audit.json\` under \`accepted_issues\` in the next review."
            else
              echo "## Security audit current"
              echo ""
              echo "Mechanical checks pass, the audit record covers this commit with no"
              echo "source drift, and every open security issue is either low-priority or"
              echo "explicitly accepted by the review."
            fi

            # Standing backlog, always shown, never a flag on its own. It is
            # context for the approver, not a property of this release.
            if [ -n "${CONTEXT_LIST:-}" ]; then
              echo ""
              echo "<details><summary>All open security issues (context, not a gate)</summary>"
              echo ""
              echo "${TOTAL:-0} open: $CONTEXT_LIST"
              echo ""
              if [ -n "${ACCEPTED_LINES:-}" ]; then
                echo "Explicitly accepted by this review: $(printf '%s' "$ACCEPTED_LINES" | paste -sd';' - | sed 's/;/; /g')"
                echo ""
              fi
              echo "</details>"
            fi
            echo ""
            echo '<details><summary>Mechanical check output</summary>'
            echo ""
            echo '```'
            cat /tmp/audit.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          # Build the member-facing sentence here, where the reason is known,
          # rather than restating an assumption at publish time (#115).
          if [ "$FLAGGED" != true ]; then
            NOTE=""
          elif [ "$COVERED" != true ]; then
            NOTE="> **Security note:** this release was NOT covered by a current security review. See the release run summary for details."
          else
            NOTE="> **Security note:** this release was reviewed (the audit record covers the released commit, with no source drift) and was published with ${FINDINGS_REASON}."
          fi

          echo "flagged=$FLAGGED" >> "$GITHUB_OUTPUT"
          echo "covered=$COVERED" >> "$GITHUB_OUTPUT"
          echo "note<<NOTE_EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTE" >> "$GITHUB_OUTPUT"
          echo "NOTE_EOF" >> "$GITHUB_OUTPUT"
          echo "reason<<EOF" >> "$GITHUB_OUTPUT"
          echo "$REASONS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  package:
    needs: security-status
    runs-on: ubuntu-latest
    # Human approval gate. The `release` environment is configured with a
    # required reviewer, so a tag push pauses here until the release is
    # approved — an unreviewed/tampered tag can't publish on its own.
    environment: release
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # OIDC token used to sign the provenance attestation
      attestations: write  # write the attestation to the GitHub attestation store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build package
        run: bash scripts/package.sh

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.zip

      - name: Attach zip + checksum to release
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_NOTE: ${{ needs.security-status.outputs.note }}
        run: |
          # SECURITY_NOTE is empty when the gate did not flag, and otherwise
          # carries the reason the gate actually established (#115). Written as
          # a full if-block: the `[ -n ] && ...` short-circuit form returns 1
          # on an empty note, which fails the step under `bash -e`.
          if [ -n "$SECURITY_NOTE" ]; then
            SECURITY_NOTE="$SECURITY_NOTE"$'\n\n'
          fi
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "${{ github.ref_name }}" dist/*.zip dist/checksums.txt \
              --title "${{ github.ref_name }}" \
              --notes "${SECURITY_NOTE}Automated ZAF app package for ${{ github.ref_name }}.

          Verify provenance before install:
            gh attestation verify tsanet-connect-v<version>.zip --repo tsanetgit/Zendesk_App
          Or verify the checksum against checksums.txt:
            sha256sum -c checksums.txt

          Install via Zendesk Admin Center → Apps and integrations → Zendesk Support apps → Upload/Update private app."
          fi
